<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>

    <style type="text/css">
        body {
            background-color: white;
            font-size: 2rem;
        }

        .container {
            margin-top: 10rem;
            border: 2px solid red;
            height: 60rem;
            margin-left: 1rem;
            margin-right: 1rem;
        }

        .input {
            margin-top: 10rem;
            border: 5px solid green;
            height: 10rem;
            margin-left: 1rem;
            margin-right: 1rem;
        }

        .input.active {
            border-color: blue;
        }

    </style>
</head>
<body>
    <h1>Hello World</h1>
    <div class="container">
        <div class="input login">
            Login
        </div>
        <div class="input password">
            Password
        </div>
    </div>

    <script>

        console.log('>>Hello World');


        const loginInput = document.querySelector('.input.login');
        const passwordInput = document.querySelector('.input.password');
        const inputs = document.querySelectorAll('.input');

        let isShown = false;

        let loginData = '';
        let passwordData = '';

        let isLogin = false;
        let isPasword = false;

        window.onScreenKeyboard.oninput = (event) => {
            console.log(">>keyboard.opinput, event.data: " + event.data + ", window.onScreenKeyboard.data: " + window.onScreenKeyboard.data);
            if (isLogin) {
                loginData = event.data;
                loginInput.innerHTML = loginData;
            } else if (isPasword) {
                passwordData = event.data;
                passwordInput.innerHTML = passwordData;
            }
        };

        window.onScreenKeyboard.onshow = () => {
            isShown = true;
            console.log('>>window.onScreenKeyboard.onshow, isShown');
        };
      
        window.onScreenKeyboard.onhide = () => {
            isShown = false;
            console.log('>>window.onScreenKeyboard.onshow, isHidden');
        };

        loginInput.addEventListener('mousedown', (event) => {
            onLoginInputClicked(event);
        });
        passwordInput.addEventListener('mousedown', (event) => {
            onPasswordInputClicked(event);
        });

        function setActiveInput(el) {
            inputs.forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function setKeyboardData(data) {
            window.onScreenKeyboard.data = data;
            window.onScreenKeyboard.hide();
            window.onScreenKeyboard.show(); 
        }

        function showIfHidden() {
            if (isShown) return;
            window.onScreenKeyboard.show(); 
            console.log('>>showIfHidden, keyboard shown');
        }

        function showKeyboard() {
            window.onScreenKeyboard.show(); 
        }

        function onLoginInputClicked(event) {
            console.log('>>onLoginInputClicked, data: ' + window.onScreenKeyboard.data);
            //setActiveInput(event.currentTarget);
            showIfHidden();
            //showKeyboard();

            isLogin = true;
            isPasword = false;
            //setKeyboardData(loginData);
            window.onScreenKeyboard.data = loginData;
        }

        function onPasswordInputClicked(event) {
            console.log('>>onPasswordInputClicked, data: ' + window.onScreenKeyboard.data);
            //setActiveInput(event.currentTarget);
            showIfHidden();
            //showKeyboard();

            isLogin = false;
            isPasword = true;
            //setKeyboardData(passwordData);
            window.onScreenKeyboard.data = passwordData;
        }

    </script>

</body>
</html>
